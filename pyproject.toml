[project]
name = "gkbot"  
version = "3.0.0"
requires-python = ">=3.13"
dependencies = [
    "notion-client==0.9.0",
    "python-dotenv",
    "gTTS",
    "wikipedia",
    "beautifulsoup4",
    "youtube-search",
    "tortoise-orm==0.21.6",
    "docx2txt",
    "varname==0.13.0",
    "yt-dlp[default]==2026.8.19",
    "gallery-dl>=1.30.10",
    "edge-tts",
    "aiogram==3.31.0",
    "uvloop>=0.21.0",
    "openai>=1.82.1",
    "asyncpg>=0.30.0",
    "aiohttp>=3.11.13",
]

[dependency-groups]
dev = [
    "mypy>=1.16.1",
    "pyright>=1.1.408",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "ruff==0.17.2",
    "types-requests>=2.32.4.20250611",
    "types-yt-dlp>=2026.8.19.20261008",
    "typos==1.51.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["bot/tests"]
pythonpath = ["bot"]

[tool.ruff]
# Runtime imports are rooted at bot/; see docs/import-ordering.md.
src = ["bot"]

[tool.ruff.lint]
# Keep import ordering explicit while preserving Ruff's other default checks.
extend-select = ["I001"]

[tool.ruff.lint.isort]
# src detects core/configs/services/etc.; also recognize package-qualified imports.
known-first-party = ["bot"]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/bot"
explicit_package_bases = true

# These installed dependencies ship neither stubs nor a py.typed marker.
# Keep missing internal imports and typed third-party imports as errors.
[[tool.mypy.overrides]]
module = [
    "gallery_dl",
    "gallery_dl.*",
    "gtts",
    "gtts.*",
    "varname",
    "varname.*",
    "youtube_search",
    "wikipedia",
    "wikipedia.*",
]
ignore_missing_imports = true
