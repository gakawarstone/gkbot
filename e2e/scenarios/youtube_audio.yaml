      text: https://www.youtube.com/watch?v=TVC_SzZr96Q
  - expect:
      method: sendMessage
      text: https://www.youtube.com/watch?v=TVC_SzZr96Q
  - click:
      button_text: "Аудио"
  - expect:
      method: sendAudio
      media_type: audio
